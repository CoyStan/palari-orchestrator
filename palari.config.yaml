# Example Palari Orchestration config.
# See schemas/palari.config.schema.json for a machine-readable schema.

project_name: Palari Orchestrator
default_branch: main

tickets_open_dir: tickets/open
tickets_proposed_dir: tickets/proposed
tickets_closed_dir: tickets/closed
reports_dir: reports
human_reports_dir: reports/human
planning_reports_dir: reports/planning
handoffs_dir: handoffs
# Shipped Palari skills live in `skills/`; adopter-generated Agent Skills
# (from `palari skill create`) are written here so the two never mix.
agent_skills_dir: agent-skills
state_dir: .palari
evidence_dir: reports/evidence
roles_active_dir: roles/active
roles_proposed_dir: roles/proposed
roles_revoked_dir: roles/revoked

# Goals are first-class founder-intent artifacts. Tickets and proposals link
# to a goal with `serves_goal`. Set require_serves_goal to `strict` to refuse
# ticket creation without a goal link, `warn` to lint-warn, or `off`.
goals_active_dir: goals/active
goals_proposed_dir: goals/proposed
goals_closed_dir: goals/closed
require_serves_goal: warn

# Workflows are company/process planning artifacts above tickets.
workflows_proposed_dir: workflows/proposed
workflows_active_dir: workflows/active
workflows_closed_dir: workflows/closed

# Human governance profiles model decision coverage, skills, and capacity.
humans_proposed_dir: humans/proposed
humans_active_dir: humans/active
humans_revoked_dir: humans/revoked

# Policy acceptance artifacts start simulation-only. Policy commands can explain
# what would happen, but cannot accept tickets or move lifecycle state.
policies_proposed_dir: policies/proposed
policies_active_dir: policies/active
policies_revoked_dir: policies/revoked

# Model routing: send each ticket to the cheapest model class that matches its
# risk tier, so frontier models are reserved for high-risk work. A ticket can
# override with frontmatter `model_hint` (class or exact model); an explicit
# `agent run --model` always wins. Map classes to concrete models per
# executor below (blank = executor default). The resolved model is recorded
# into run evidence for per-ticket cost accounting.
model_routing_enabled: true
model_class_r1: fast
model_class_r2: balanced
model_class_r3: frontier
model_class_r4: frontier
model_class_r5: frontier
model_class_default: balanced

# model_fast_codex: gpt-5-mini
# model_balanced_codex: gpt-5
# model_frontier_codex: gpt-5-pro

# OpenRouter executor (optional, off by default). Bring your own key: the
# adapter reads it from the env var named by openrouter_api_key_env and never
# stores it. openrouter_allowed_models is a hard allowlist: agents can only
# spend on models the human listed. Routing stays deterministic:
# risk tier -> class -> model_<class>_openrouter and the adapter refuses
# anything off the list. Temperature 0 and a fixed seed keep runs as
# reproducible as providers allow.
# Advisor: set openrouter_advisor_model to let a cheap executor consult a
# stronger model mid-generation (OpenRouter `openrouter:advisor` tool), so
# frontier prices are paid only for the moments that need frontier thinking.
openrouter_enabled: false
openrouter_api_key_env: OPENROUTER_API_KEY
openrouter_base_url: https://openrouter.ai/api/v1
openrouter_temperature: 0
openrouter_seed: 7
openrouter_timeout_seconds: 300
openrouter_allowed_models:
  - deepseek/deepseek-chat
  - anthropic/claude-sonnet-4.6
  - anthropic/claude-fable-5
# openrouter_advisor_model: anthropic/claude-fable-5
# openrouter_advisor_name: architect
# openrouter_advisor_instructions: You are a systems architect. Prioritize simplicity.
# model_fast_openrouter: deepseek/deepseek-chat
# model_balanced_openrouter: anthropic/claude-sonnet-4.6
# model_frontier_openrouter: anthropic/claude-fable-5

# Decisions are the structured "bring me a decision" artifacts agents draft
# and only humans record. Open decisions surface in the snapshot, the founder
# inbox, and `palari run --dry-run` as stop items.
decisions_open_dir: decisions/open
decisions_decided_dir: decisions/decided

memory_dir: memory
memory_index_backend: sqlite # sqlite | json | none
memory_cache_dir: .palari/cache
memory_packet_limit: 5
memory_related_limit: 2
memory_active_only_default: true

# Relative paths are resolved from the repository root.
worktree_base: ../palari-orchestrator-worktrees

claim_lease_seconds: 300
scope_overlap_policy: block
concurrency_ignored_overlap_paths:
  - tickets/**
  - reports/**
  - reports/human/**
  - handoffs/**
  - .palari/**

# Generated/local artifacts are ignored by `palari init` and classified by
# `palari hygiene` when old repos still surface them in git status.
hygiene_generated_paths:
  - __pycache__/**
  - "**/__pycache__/**"
  - "*.pyc"
  - "**/*.pyc"
  - .DS_Store
  - .palari/**
  - .expo/**
  - .metro/**
  - node_modules/**
  - coverage/**
  - .turbo/**
  - .next/**
  - dist/**
  - build/**
  - android/.gradle/**
  - android/app/build/**
  - ios/Pods/**

# Agent authority profiles describe what an autonomous executor may do without
# turning a human instruction into an implicit merge or acceptance permission.
# Public/default posture is conservative: agents may prepare work, but humans
# keep main-branch merge and ticket acceptance authority.
authority_profile: team-safe
authority_profiles:
  solo-founder:
    agent_can_commit: true
    agent_can_push_branch: true
    agent_can_open_pr: true
    agent_can_merge_main: true
    agent_can_accept: user-explicit
  team-safe:
    agent_can_commit: true
    agent_can_push_branch: true
    agent_can_open_pr: true
    agent_can_merge_main: false
    agent_can_accept: false
  strict:
    agent_can_commit: false
    agent_can_push_branch: false
    agent_can_open_pr: false
    agent_can_merge_main: false
    agent_can_accept: false

# Precise secret-surface patterns. Substring globs such as "**/*secret*" or
# "**/*token*" are intentionally not used: they block legitimate source files
# (for example gate/forgegate/token.py) while a renamed credentials file
# evades them. Path rules are a guardrail, not secret detection; pair them
# with a content scanner such as gitleaks in CI for real protection.
default_forbidden_paths:
  - .env
  - .env.*
  - "**/.env"
  - "**/.env.*"
  - "**/secrets/**"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.keystore"
  - "**/*.p12"
  - "**/id_rsa*"
  - "**/id_ed25519*"
  - "**/credentials*"
  - "**/.aws/**"
  - "**/.ssh/**"
  - infra/prod/**
  - prod/**

# Optional repo-wide custom report gates. Tickets can also declare
# `required_reports` directly in frontmatter. Report names are repository
# choices; the core only checks that a matching custom report exists.
required_reports: []

acceptance:
  implementation_self_acceptance: forbidden

# Forge-proof accept gate (vendored forgegate kernel in gate/).
# When enabled, `palari accept` additionally requires a cryptographic
# verdict: signed implement, test, and review attestations whose delegation
# token chains verify to the repository root key, with byte-for-byte hash
# flow between steps, dual control by distinct keys, commit binding, and a
# freshness window. Acceptance fails closed if the kernel is unavailable.
# Requires python3 with the 'cryptography' package. Quick start:
#   ./bin/palari gate init
#   ./bin/palari gate setup-ticket TICKET-ID
# See contracts/signed-acceptance.md and gate/README.md.
gate:
  enabled: false
  layout: layouts/palari-change.yml
  keys_dir: .palari/gate/keys # private keys; gitignored, never commit
  root_pub_file: .palari/gate/root.pub
  token_validity_days: 365 # orchestrator token lifetime
  ticket_token_days: 30 # per-ticket step token lifetime
  max_age_seconds: 86400 # refuse evidence older than this at verify time
  ci_key: ci # key identity that signs the test step
