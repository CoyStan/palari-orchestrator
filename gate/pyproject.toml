[project]
name = "forgegate"
version = "0.1.0"
description = "Forge-proof accept gates for agent work"
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "click>=8", "PyYAML>=6"]

[project.scripts]
forgegate = "forgegate.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
