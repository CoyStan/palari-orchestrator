name: Palari Governance

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  palari:
    name: palari
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Palari gates
        shell: bash
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          PALARI_TICKET_ID: ${{ vars.PALARI_TICKET_ID }}
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}:${GITHUB_BASE_REF}" || true
          ticket="${PALARI_TICKET_ID:-}"
          if [[ -z "$ticket" && "${GITHUB_HEAD_REF:-}" == ticket/* ]]; then
            ticket="${GITHUB_HEAD_REF#ticket/}"
          fi
          if [[ -z "$ticket" ]]; then
            mapfile -t ticket_ids < <(
              git diff --name-only "$GITHUB_BASE_REF"...HEAD -- 'tickets/open/*.md' 'tickets/closed/*.md' |
                while IFS= read -r ticket_file; do
                  awk '
                    NR == 1 && $0 == "---" { in_fm = 1; next }
                    in_fm && $0 == "---" { exit }
                    in_fm && $1 == "id:" { print $2; exit }
                  ' "$ticket_file"
                done |
                sed '/^$/d' |
                sort -u
            )
            if (( ${#ticket_ids[@]} == 1 )); then
              ticket="${ticket_ids[0]}"
            fi
          fi
          if [[ -n "$ticket" ]]; then
            ./bin/palari ci "$ticket" --base "$GITHUB_BASE_REF"
          else
            ./bin/palari ci
          fi

      - name: Package Palari evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/evidence
          tar -czf palari-evidence.tgz reports/evidence

      - name: Upload Palari evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palari-evidence
          path: palari-evidence.tgz
          if-no-files-found: ignore

      - name: Attest Palari evidence
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: palari-evidence.tgz

      - name: Upload Palari SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: reports/evidence
          category: palari
