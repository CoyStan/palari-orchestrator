name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Syntax check
        run: |
          bash -n bin/palari
          bash -n lib/palari/*.bash
          bash -n tests/run-cli-structure.sh
          bash -n tests/run-goals.sh
          bash -n tests/run-decisions.sh
          bash -n tests/run-queue-dry-run.sh
          bash -n tests/run-golden.sh
          bash -n tests/run-adoption.sh
          bash -n tests/run-proposals.sh
          bash -n tests/run-roles.sh
          bash -n tests/run-agent-wrapper.sh
          bash -n tests/run-authority-lifecycle.sh
          bash -n tests/run-github-ci.sh
          bash -n tests/run-hygiene.sh
          bash -n tests/run-dashboard-rubric.sh
          bash -n tests/run-gate-kernel.sh
          bash -n tests/run-gate.sh
          bash -n tests/run-plugin-structure.sh
          bash -n tests/run-skills.sh
          bash -n tests/run-readme-assets.sh
          bash -n tests/run-sandbox.sh
          bash -n tests/run-agent-mock.sh
          bash -n tests/run-agent-codex.sh

      - name: CLI structure
        run: tests/run-cli-structure.sh

      - name: Goals
        run: tests/run-goals.sh

      - name: Decisions
        run: tests/run-decisions.sh

      - name: Queue dry-run
        run: tests/run-queue-dry-run.sh

      - name: Adoption
        run: tests/run-adoption.sh

      - name: Proposals
        run: tests/run-proposals.sh

      - name: Roles
        run: tests/run-roles.sh

      - name: Agent wrapper
        run: tests/run-agent-wrapper.sh

      - name: Authority and lifecycle
        run: tests/run-authority-lifecycle.sh

      - name: GitHub CI discovery
        run: tests/run-github-ci.sh

      - name: Hygiene
        run: tests/run-hygiene.sh

      - name: Golden flow
        run: tests/run-golden.sh

      - name: Dashboard rubric
        run: tests/run-dashboard-rubric.sh

      - name: Gate kernel adversarial suite
        run: tests/run-gate-kernel.sh

      - name: Gate end-to-end governance
        run: tests/run-gate.sh

      - name: Plugin structure
        run: tests/run-plugin-structure.sh

      - name: Skills
        run: tests/run-skills.sh

      - name: README assets
        run: tests/run-readme-assets.sh

      - name: Sandbox lifecycle
        run: tests/run-sandbox.sh

      - name: Mock executor
        run: tests/run-agent-mock.sh

      - name: Codex executor (dry-run)
        run: tests/run-agent-codex.sh

      - name: Palari lint
        run: ./bin/palari lint
