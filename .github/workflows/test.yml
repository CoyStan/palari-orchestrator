name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Syntax check
        run: |
          bash -n bin/palari
          bash -n lib/palari/*.bash
          bash -n tests/run-cli-structure.sh
          bash -n tests/run-golden.sh
          bash -n tests/run-adoption.sh
          bash -n tests/run-proposals.sh
          bash -n tests/run-agent-wrapper.sh
          bash -n tests/run-dashboard-rubric.sh

      - name: CLI structure
        run: tests/run-cli-structure.sh

      - name: Adoption
        run: tests/run-adoption.sh

      - name: Proposals
        run: tests/run-proposals.sh

      - name: Agent wrapper
        run: tests/run-agent-wrapper.sh

      - name: Golden flow
        run: tests/run-golden.sh

      - name: Dashboard rubric
        run: tests/run-dashboard-rubric.sh

      - name: Palari lint
        run: ./bin/palari lint
