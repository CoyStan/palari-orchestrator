name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Syntax check
        run: |
          bash -n bin/palari
          bash -n tests/run-golden.sh
          bash -n tests/run-dashboard-rubric.sh

      - name: Golden flow
        run: tests/run-golden.sh

      - name: Dashboard rubric
        run: tests/run-dashboard-rubric.sh

      - name: Palari lint
        run: ./bin/palari lint
